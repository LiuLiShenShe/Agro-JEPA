manifest_id: fip1-s3-v0-consecutive-v1
pilot: true
pilot_note: Subset of the official train split (per-year plot sample) plus all validation
  plots; not the full 2,930 train plots.  Reported as a Pilot, not a full-FIP baseline.
data:
  pairs: external_data/pairs_cache/fip1_pairs_s2.parquet
  selection: data/manifests/s3_image_selection.json
  feature_index: external_data/s3_features/index.parquet
  index_out: external_data/s3_index/fip1_s3_v0_consecutive_index.parquet
  index_stats: reports/s3_index_stats_consecutive.json
  selection_rule_out: data/manifests/s3_selection_rule.json
  pair_types:
  - span7
  - span14
  - consecutive
  splits:
  - train
  - validation
  traits:
  - cc
  - ph
  label_max_lag_days: 7
  dedupe_physical_pairs: true
model:
  num_patches: 256
  visual_dim: 768
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0.0
  pool: mean
  action_emb_dim: 10
  num_action_repeat: 16
  proprio_emb_dim: 10
  num_proprio_repeat: 16
  delta:
    n_frequencies: 8
    base_frequency: 2.0
    hidden_dim: 256
    output_dim: 10
    dropout: 0.0
    use_learned_scale: true
training:
  seed: 0
  epochs: 20
  batch_size: 128
  num_workers: 8
  lr: 0.0003
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  amp: bf16
  log_every: 20
  early_stop_patience: 5
  output_dir: external_data/s3_runs/v0_consecutive
  device: cuda:0
eval:
  batch_size: 256
  probe_epochs: 150
  probe_lr: 0.001
  probe_weight_decay: 0.01
  probe_batch_size: 256
  probe_seeds:
  - 0
  - 1
  - 2
  probe_patience: 20
