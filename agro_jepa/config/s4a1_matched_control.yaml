# Agro-JEPA S4A.1 configuration -- parameter-matched constant-time control
#
# This stage answers one question: after removing *sample-level* time
# information while keeping the network width and the parameter count identical
# to b3_delta, does the real per-pair delta_days still improve future-latent
# prediction?
#
# Everything except the condition table, the seed set and the output paths is
# copied verbatim from agro_jepa/config/s4_pilot.yaml (whose SHA is frozen in
# reports/s4_verify.json).  The S4A config is never edited here.
#
# Frozen inputs are read-only: the S3 pair index, the DINOv2 feature cache and
# the S4 conditioning npz are byte-identical to S4A.

stage: S4A.1
manifest_id: fip1-s4a1-matched-control-v1
pilot: true
pilot_note: >-
  Same pilot subset as S4A: the S3-frozen 1,000 official-train plots plus all
  380 official validation plots.  Official test splits are never read in S4A.1.

frozen:
  index: external_data/s3_index/fip1_s3_v0_index.parquet
  # Stable digest rule (agro_jepa.datasets.s3_pairs.index_sha256), not raw bytes.
  index_sha256: f6ef1871655277549aba2d883b6f76a5831b7976af90fc74d80206591d884933
  feature_index: external_data/s3_features/index.parquet
  feature_cache_version: mainline224_s1-v1
  visual_encoder: dinov2_vitb14
  visual_encoder_commit: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
  upstream_dino_wm_commit: 0a9492fa12044b852ae9e001cc74604b79c8bb0c
  v0_checkpoint: external_data/s3_runs/v0/checkpoints/best.pt
  v0_checkpoint_sha256: c337fca506e6a7e31fb90fca1f9197033992c2f8054287d76ec69b4c37426414
  v0_config: agro_jepa/config/s3_v0.yaml
  s4a_config: agro_jepa/config/s4_pilot.yaml
  s4a_config_sha256: dc61ea4c6f28f9c155b800db27d15166bf8684444e718c4e3b2fb741a0e06382

data:
  index: external_data/s3_index/fip1_s3_v0_index.parquet
  weather_daily: data/manifests/weather_daily_first_plot_per_year.csv
  conditioning_dir: external_data/s4_conditioning
  conditioning_npz: external_data/s4_conditioning/s4_pair_conditioning.npz
  splits: [train, validation]
  traits: [cc, ph]
  pair_types: [span7, span14]
  label_max_lag_days: 7
  # Only confirmed-unit channels; P_sum_raw is excluded (unit unresolved).
  weather_channels: [T_mean_C, T_max_C, T_min_C, RH_mean_pct, Rs_sum_MJ_m2_d]
  # Frozen S2/S3 interval convention.
  interval_window: "(t_a, t_b]"
  # Protocol P past window: strictly before t_a.
  past_window_days: 28
  gdd_bases: [0.0, 5.0]
  gdd_past_windows: [7, 14, 28]

# --- inner model-selection split (official train plots only) --------------
split:
  seed: 20261025              # same seed/rule as the S3.2 probe protocol
  inner_train_fraction: 0.80
  strata: harvest_year
  # S4A.1 never selects on the official validation split.

model:
  num_patches: 256
  visual_dim: 768
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0.0
  pool: mean
  # Upstream concat_dim=1 channel geometry, identical to V0.
  action_emb_dim: 10
  num_action_repeat: 16
  proprio_emb_dim: 10
  num_proprio_repeat: 16
  delta:
    n_frequencies: 8
    base_frequency: 2.0
    hidden_dim: 256
    output_dim: 10
    dropout: 0.0
    use_learned_scale: true
  gdd:
    n_frequencies: 8
    base_frequency: 2.0
    hidden_dim: 128
    output_dim: 10
    dropout: 0.0
    use_learned_scale: false
  weather:
    n_channels: 5
    hidden_dim: 64
    output_dim: 10
    dropout: 0.0
    pooling: masked_mean

training:
  # Three paired seeds: {0,1} are the frozen S4A runs, seed 2 is new in S4A.1.
  # The same set is used for every trainable condition, without exception.
  seeds: [0, 1, 2]
  candidate_epochs: 16
  early_stop_patience: 3
  batch_size: 128
  num_workers: 8
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  amp: bf16
  log_every: 50
  device: cuda:0                # CUDA_VISIBLE_DEVICES=1 maps this to GPU1
  output_root: external_data/s4a1_runs
  # Checkpoints of a condition may live in more than one root: seeds {0,1} of
  # b2_no_time / b3_delta are the frozen S4A checkpoints and are never rewritten.
  checkpoint_roots:
    - external_data/s4a1_runs
    - external_data/s4_runs
  # Selection rule, identical for every condition.
  selection_metric: inner_dev_mse_pred
  selection_rule: minimum inner-dev future-latent MSE over the candidate budget

eval:
  batch_size: 512
  bootstrap_resamples: 2000
  bootstrap_seed: 20261024
  device: cuda:0

probe:
  # S3.2 corrected probe protocol, reused unchanged.
  plot_split_seed: 20261025
  inner_train_fraction: 0.80
  strata: harvest_year
  candidate_epochs: 150
  patience: 20
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  seeds: [0, 1, 2]
  lag_variants:
    primary: 7
    strict_lag3: 3
    same_day: 0
  bootstrap_resamples: 2000
  bootstrap_seed: 20261024

# --- condition table (S4A.1 subset) --------------------------------------
# Only the arms needed for the matched control are listed.  The GDD / weather
# arms of S4A are not re-run in this stage and are not part of its comparisons.
conditions:
  b0_persistence:
    mode: baseline
    protocol: none
    description: "Z_hat_b = Z_a"
  b1_train_mean:
    mode: baseline
    protocol: none
    description: "Z_hat_b = mean over train pairs of Z_b (train split only)"
  b2_no_time:
    mode: trained
    protocol: none
    use_delta: false
    gdd_mode: none
    weather_mode: none
    description: "z_a only; the action channel and every time input are removed"
  b2_no_time_constant_delta:
    mode: trained
    protocol: none
    use_delta: true
    delta_mode: constant
    # Rule and expected value are pre-registered before any S4A.1 number is
    # produced.  The trainer recomputes the value from its own inner-train rows
    # and refuses to run if it differs from this number.
    fixed_delta_rule: inner_train_median
    fixed_delta_days: 9.0
    gdd_mode: none
    weather_mode: none
    description: >-
      S4A.1 B2-C: identical ViTPredictor width and the full DeltaTimeEncoder as
      b3_delta, but every train / inner-dev / official-validation sample
      receives one fixed interval (inner-train median = 9 d).  No sample-level
      delta, no date, no GDD, no weather; no extra parameters.
  b3_delta:
    mode: trained
    protocol: none
    use_delta: true
    gdd_mode: none
    weather_mode: none
    description: "z_a + delta_days (V0 match, retrained under the S4A budget)"

# Conditions whose predicted features feed the E2 phenotype readout.
e2_conditions: [b2_no_time, b2_no_time_constant_delta, b3_delta]
# No environment-conditioned arm is part of the S4A.1 E2 comparison.
e2_environment_conditions: []

artifacts:
  results_json: reports/s4a1_e1_results.json
  e1_predictions: reports/s4a1_e1_val_predictions.parquet
  e1_bootstrap: reports/s4a1_e1_bootstrap.json
  e2_metrics: reports/s4a1_e2_probe_metrics.json
  e2_predictions: reports/s4a1_e2_probe_val_predictions.parquet
  e2_pooled_dir: external_data/s4a1_runs/e2_pooled
  run_logs: reports/s4a1_run_logs

# --- S4B test-data preparation (audit only; no test evaluation) -----------
s4b:
  # Official FIP 1.0 splits, in the order of agro_jepa.datasets.fip_pairs.
  official_splits:
    - train
    - validation
    - test_plot
    - test_genotype
    - test_environment
    - test_genotype_environment
  test_splits:
    - test_plot
    - test_genotype
    - test_environment
    - test_genotype_environment
  plots_manifest: data/manifests/fip1_plots.csv
  observations_manifest: data/manifests/fip1_observations.csv.gz
  s2_pairs: external_data/pairs_cache/fip1_pairs_s2.parquet
  images_root: external_data/fip1_images
  feature_index: external_data/s3_features/index.parquet
  index_out_dir: external_data/s4b_index
  conditioning_out_dir: external_data/s4b_conditioning
  pair_rule:
    pair_types: [span7, span14]
    span_tolerance_days: 2
    min_delta_days: 1
    max_delta_days: 16
    dedupe_physical_pairs: true
