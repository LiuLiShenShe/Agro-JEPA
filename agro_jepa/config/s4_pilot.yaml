# Agro-JEPA S4A pilot configuration -- controlled temporal / GDD / weather baselines
#
# Everything here is fixed before any S4A number is produced.  The frozen S3
# pair index and the frozen DINOv2 feature cache are read-only inputs; no S1/S2/
# S3 artifact is rewritten.
#
# Paths are relative to the repository root.

stage: S4A
manifest_id: fip1-s4a-pilot-v1
pilot: true
pilot_note: >-
  Pilot subset: the S3-frozen 1,000 official-train plots plus all 380 official
  validation plots. This is not the full 2,930-plot FIP train split. Official
  test splits are never read in S4A.

frozen:
  index: external_data/s3_index/fip1_s3_v0_index.parquet
  # Stable digest rule (agro_jepa.datasets.s3_pairs.index_sha256), not raw bytes.
  index_sha256: f6ef1871655277549aba2d883b6f76a5831b7976af90fc74d80206591d884933
  feature_index: external_data/s3_features/index.parquet
  feature_cache_version: mainline224_s1-v1
  visual_encoder: dinov2_vitb14
  visual_encoder_commit: 7764ea0f912e53c92e82eb78a2a1631e92725fc8
  upstream_dino_wm_commit: 0a9492fa12044b852ae9e001cc74604b79c8bb0c
  v0_checkpoint: external_data/s3_runs/v0/checkpoints/best.pt
  v0_checkpoint_sha256: c337fca506e6a7e31fb90fca1f9197033992c2f8054287d76ec69b4c37426414
  v0_config: agro_jepa/config/s3_v0.yaml

data:
  index: external_data/s3_index/fip1_s3_v0_index.parquet
  weather_daily: data/manifests/weather_daily_first_plot_per_year.csv
  conditioning_dir: external_data/s4_conditioning
  conditioning_npz: external_data/s4_conditioning/s4_pair_conditioning.npz
  splits: [train, validation]
  traits: [cc, ph]
  pair_types: [span7, span14]
  label_max_lag_days: 7
  # Only confirmed-unit channels; P_sum_raw is excluded (unit unresolved).
  weather_channels: [T_mean_C, T_max_C, T_min_C, RH_mean_pct, Rs_sum_MJ_m2_d]
  # Frozen S2/S3 interval convention.
  interval_window: "(t_a, t_b]"
  # Protocol P past window: strictly before t_a.
  past_window_days: 28
  gdd_bases: [0.0, 5.0]
  gdd_past_windows: [7, 14, 28]

# --- inner model-selection split (official train plots only) --------------
split:
  seed: 20261025              # same seed/rule as the S3.2 probe protocol
  inner_train_fraction: 0.80
  strata: harvest_year
  # S4A never selects on the official validation split.

model:
  num_patches: 256
  visual_dim: 768
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0.0
  pool: mean
  # Upstream concat_dim=1 channel geometry, identical to V0.
  action_emb_dim: 10
  num_action_repeat: 16
  proprio_emb_dim: 10
  num_proprio_repeat: 16
  delta:
    n_frequencies: 8
    base_frequency: 2.0
    hidden_dim: 256
    output_dim: 10
    dropout: 0.0
    use_learned_scale: true
  gdd:
    n_frequencies: 8
    base_frequency: 2.0
    hidden_dim: 128
    output_dim: 10
    dropout: 0.0
    use_learned_scale: false
  weather:
    n_channels: 5
    hidden_dim: 64
    output_dim: 10
    dropout: 0.0
    pooling: masked_mean

training:
  # The same seed set is used for every trainable condition.
  seeds: [0, 1]
  candidate_epochs: 16
  early_stop_patience: 3
  batch_size: 128
  num_workers: 8
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  grad_clip: 1.0
  amp: bf16
  log_every: 50
  device: cuda:0                # CUDA_VISIBLE_DEVICES=1 maps this to GPU1
  output_root: external_data/s4_runs
  # Selection rule, identical for every condition.
  selection_metric: inner_dev_mse_pred
  selection_rule: minimum inner-dev future-latent MSE over the candidate budget

eval:
  batch_size: 512
  bootstrap_resamples: 2000
  bootstrap_seed: 20261024
  device: cuda:0

probe:
  # S3.2 corrected probe protocol, reused unchanged.
  plot_split_seed: 20261025
  inner_train_fraction: 0.80
  strata: harvest_year
  candidate_epochs: 150
  patience: 20
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  seeds: [0, 1, 2]
  lag_variants:
    primary: 7
    strict_lag3: 3
    same_day: 0
  bootstrap_resamples: 2000
  bootstrap_seed: 20261024

# --- the pre-registered S4A condition table ------------------------------
# mode: baseline | trained
# protocol: none | P (deployable) | R (retrospective/oracle interval)
conditions:
  b0_persistence:
    mode: baseline
    protocol: none
    description: "Z_hat_b = Z_a"
  b1_train_mean:
    mode: baseline
    protocol: none
    description: "Z_hat_b = mean over train pairs of Z_b (train split only)"
  b2_no_time:
    mode: trained
    protocol: none
    use_delta: false
    gdd_mode: none
    weather_mode: none
    description: "z_a only; the action channel and every time input are removed"
  b3_delta:
    mode: trained
    protocol: none
    use_delta: true
    gdd_mode: none
    weather_mode: none
    description: "z_a + delta_days (V0 match, retrained under the S4A budget)"
  b4_gdd_R:
    mode: trained
    protocol: R
    use_delta: false
    gdd_mode: interval
    gdd_base: 0.0
    weather_mode: none
    description: "z_a + interval GDD (T_base 0); isolates GDD without delta"
  b4_delta_gdd_R:
    mode: trained
    protocol: R
    use_delta: true
    gdd_mode: interval
    gdd_base: 0.0
    weather_mode: none
    description: "z_a + delta_days + interval GDD (T_base 0); primary GDD arm"
  b4_delta_gdd_R_tbase5:
    mode: trained
    protocol: R
    use_delta: true
    gdd_mode: interval
    gdd_base: 5.0
    weather_mode: none
    description: "sensitivity: T_base = 5 degC"
  b4_delta_gdd_P:
    mode: trained
    protocol: P
    use_delta: true
    gdd_mode: past
    gdd_base: 0.0
    weather_mode: none
    description: "z_a + delta_days + past-7/14/28-d GDD (deployable)"
  b5_delta_weather_P:
    mode: trained
    protocol: P
    use_delta: true
    gdd_mode: none
    weather_mode: past
    description: "z_a + delta_days + GRU over the past 28 d (deployable)"
  b5_delta_weather_R:
    mode: trained
    protocol: R
    use_delta: true
    gdd_mode: none
    weather_mode: interval
    description: "z_a + delta_days + GRU over (t_a, t_b] (oracle interval)"

# Conditions whose predicted features feed the E2 phenotype readout.
e2_conditions: [b2_no_time, b3_delta, b4_gdd_R, b4_delta_gdd_R, b4_delta_gdd_R_tbase5, b4_delta_gdd_P, b5_delta_weather_P, b5_delta_weather_R]
# Conditions that count as "GDD / weather baseline predicted features" (E2 C).
e2_environment_conditions: [b4_gdd_R, b4_delta_gdd_R, b4_delta_gdd_R_tbase5, b4_delta_gdd_P, b5_delta_weather_P, b5_delta_weather_R]

artifacts:
  results_json: reports/s4_pilot_results.json
  e1_predictions: reports/s4_e1_val_predictions.parquet
  e1_bootstrap: reports/s4_e1_bootstrap.json
  e2_metrics: reports/s4_e2_probe_metrics.json
  e2_predictions: reports/s4_e2_probe_val_predictions.parquet
  e2_pooled_dir: external_data/s4_runs/e2_pooled
  run_logs: reports/s4_run_logs
